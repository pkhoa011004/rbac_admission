# ArgoCD App: Deploy Prometheus + Alertmanager + Grafana stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'severity']
              group_wait: 10s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'email-notifications'
              routes:
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: 'null'
              - name: 'email-notifications'
                email_configs:
                  - to: 'phuockhoamai@gmail.com'
                    from: 'phuockhoamai@gmail.com'
                    smarthost: 'smtp.gmail.com:587'
                    auth_username: 'phuockhoamai@gmail.com'
                    auth_password_file: /etc/alertmanager/secrets/alertmanager-email/password
                    require_tls: true
                    headers:
                      Subject: '🚨 [W10 Demo Alert] {{ .GroupLabels.alertname }} - {{ .GroupLabels.severity }}'
                    html: |
                      <html>
                        <body>
                          <p>W10 Demo - Kubernetes Monitoring alert</p>
                        </body>
                      </html>

          alertmanagerSpec:
            secrets:
              - alertmanager-email
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
