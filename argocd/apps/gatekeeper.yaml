# ArgoCD App: Deploy OPA Gatekeeper controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    chart: gatekeeper
    targetRevision: 3.18.2
    helm:
      parameters:
        - name: replicas
          value: "1"
        - name: auditInterval
          value: "0"
        - name: postInstall.labelNamespace.enabled
          value: "false"
        - name: postUpgrade.labelNamespace.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
