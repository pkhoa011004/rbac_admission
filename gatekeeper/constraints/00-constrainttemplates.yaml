apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedimagetags
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedImageTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedimagetags

        violation[{"msg": msg}] {
          container := containers[_]
          tag := input.parameters.tags[_]
          endswith(container.image, sprintf(":%s", [tag]))
          msg := sprintf("container <%s> uses disallowed image tag <%s>", [container.name, tag])
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not has_explicit_tag_or_digest(container.image)
          msg := sprintf("container <%s> must use an explicit non-latest image tag or digest", [container.name])
        }

        has_explicit_tag_or_digest(image) {
          contains(image, "@sha256:")
        }

        has_explicit_tag_or_digest(image) {
          parts := split(image, "/")
          last := parts[count(parts) - 1]
          contains(last, ":")
        }

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredcontainerlimits
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredContainerLimits
      validation:
        openAPIV3Schema:
          type: object
          properties:
            limits:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredcontainerlimits

        violation[{"msg": msg}] {
          container := containers[_]
          required := input.parameters.limits[_]
          not container.resources.limits[required]
          msg := sprintf("container <%s> must set resources.limits.%s", [container.name, required])
        }

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowrunasuserzero
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowRunAsUserZero
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowrunasuserzero

        violation[{"msg": msg}] {
          pod_spec.securityContext.runAsUser == 0
          msg := "pod template must not set securityContext.runAsUser to 0"
        }

        violation[{"msg": msg}] {
          container := containers[_]
          container.securityContext.runAsUser == 0
          msg := sprintf("container <%s> must not set securityContext.runAsUser to 0", [container.name])
        }

        pod_spec := input.review.object.spec {
          input.review.object.kind == "Pod"
        }

        pod_spec := input.review.object.spec.template.spec {
          input.review.object.kind != "Pod"
        }

        containers[container] {
          container := pod_spec.containers[_]
        }

        containers[container] {
          container := pod_spec.initContainers[_]
        }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowhostnetwork
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowHostNetwork
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowhostnetwork

        violation[{"msg": msg}] {
          pod_spec.hostNetwork == true
          msg := "pod template must not set hostNetwork to true"
        }

        pod_spec := input.review.object.spec {
          input.review.object.kind == "Pod"
        }

        pod_spec := input.review.object.spec.template.spec {
          input.review.object.kind != "Pod"
        }
